name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Package build as tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/hypermusic-ai-svelte.tar.gz build package.json package-lock.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypermusic-ai-svelte
          path: dist/hypermusic-ai-svelte.tar.gz
          if-no-files-found: error
