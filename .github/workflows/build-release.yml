name: Build (Release)

on:
  workflow_run:
    workflows: ["Build and Test (Debug)"]
    types: [completed]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          VITE_SERVICES_API_BASE_URL: ${{ vars.VITE_SERVICES_API_BASE_URL }}
          VITE_CHAIN_API_BASE_URL: ${{ vars.VITE_CHAIN_API_BASE_URL }}

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Package build as tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/hypermusic-ai-svelte.tar.gz build node_modules package.json package-lock.json .nvmrc

      - name: Smoke test release artifact
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          log_file="$RUNNER_TEMP/hypermusic-ai-smoke.log"

          tar -xzf dist/hypermusic-ai-svelte.tar.gz -C "$smoke_dir"

          cd "$smoke_dir"
          PORT=4177 HOST=127.0.0.1 node build >"$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:4177/" >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Release artifact server exited before serving requests."
              cat "$log_file"
              exit 1
            fi

            sleep 1
          done

          echo "Release artifact server did not become ready."
          cat "$log_file"
          exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypermusic-ai-svelte
          path: dist/hypermusic-ai-svelte.tar.gz
          if-no-files-found: error
